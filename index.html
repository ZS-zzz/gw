<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover" />
    <title>无名小服 · 群组状态</title>
    <!-- 预连接加速：提前建立与外部 API 的连接 -->
    <link rel="preconnect" href="https://api.mcstatus.io" crossorigin />
    <link rel="preconnect" href="https://www.loliapi.com" crossorigin />
    <link rel="preconnect" href="https://uapis.cn" crossorigin />
    <link rel="dns-prefetch" href="https://api.mcstatus.io" />
    <link rel="dns-prefetch" href="https://www.loliapi.com" />
    <link rel="dns-prefetch" href="https://uapis.cn" />
    <script>
        (function() {
            if (localStorage.getItem('darkMode') === 'true') {
                document.documentElement.classList.add('dark');
            }
        })();
    </script>
    <style>
        /* ========== 全局变量 ========== */
        :root {
            --primary-blue: #1e88e5;
            --light-blue: #42a5f5;
            --text-dark: #333333;
            --online: #4caf50;
            --offline: #f44336;
            --starting: #ff9800;
            --card-bg: rgba(255, 255, 255, 0.10);
            --card-bg-hover: rgba(255, 255, 255, 0.20);
            --bg-start: #f5f9ff;
            --bg-end: #e3f2fd;
            --border-light: rgba(255, 255, 255, 0.35);
            --border-light-hover: rgba(255, 255, 255, 0.60);
            --shadow-md: 0 8px 32px rgba(0, 0, 0, 0.10), 0 2px 8px rgba(0, 0, 0, 0.04);
            --shadow-lg: 0 16px 56px rgba(0, 0, 0, 0.16), 0 8px 24px rgba(0, 0, 0, 0.06);
            --shadow-hover: 0 20px 64px rgba(0, 0, 0, 0.20), 0 8px 28px rgba(0, 0, 0, 0.08);
            --ease-elastic: cubic-bezier(0.34, 1.56, 0.64, 1);
            --glass-blur: 14px;
            --glass-saturate: 180%;
            --nav-btn-radius: 40px;
            --card-radius: 24px;
        }
        :root.dark {
            --primary-blue: #64b5f6;
            --light-blue: #90caf9;
            --text-dark: #eef4ff;
            --online: #81c784;
            --offline: #ef9a9a;
            --starting: #ffb74d;
            --card-bg: rgba(0, 0, 0, 0.35);
            --card-bg-hover: rgba(0, 0, 0, 0.50);
            --border-light: rgba(255, 255, 255, 0.12);
            --border-light-hover: rgba(255, 255, 255, 0.30);
            --shadow-md: 0 8px 32px rgba(0, 0, 0, 0.6), 0 2px 8px rgba(0, 0, 0, 0.3);
            --shadow-lg: 0 16px 56px rgba(0, 0, 0, 0.8), 0 8px 24px rgba(0, 0, 0, 0.4);
            --shadow-hover: 0 20px 64px rgba(0, 0, 0, 0.9), 0 8px 28px rgba(0, 0, 0, 0.5);
            --bg-start: #121f2a;
            --bg-end: #1a2c36;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        /* ========== 页面基础 + 修复左右晃动 ========== */
        html {
            overflow-x: hidden;
            scrollbar-gutter: stable;
            width: 100%;
        }
        body {
            background-color: var(--bg-start);
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            color: var(--text-dark);
            font-family: 'Segoe UI', 'Microsoft YaHei', system-ui, sans-serif;
            min-height: 100vh;
            width: 100%;
            padding: 12px 12px 0 12px;
            transition: color 0.3s ease, background-color 0.4s ease;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
            display: flex;
            flex-direction: column;
        }
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background: rgba(245, 249, 255, 0.45);
            backdrop-filter: blur(2px);
            -webkit-backdrop-filter: blur(2px);
            z-index: -1;
            transition: background 0.4s ease;
            pointer-events: none;
        }
        :root.dark body::before {
            background: rgba(18, 31, 42, 0.60);
        }
        .container {
            max-width: 1100px;
            margin: 0 auto;
            flex: 1;
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 24px;
        }

        /* ========== 全屏加载动画 ========== */
        .page-loader {
            position: fixed;
            inset: 0;
            z-index: 9999;
            background: linear-gradient(135deg, var(--bg-start) 0%, var(--bg-end) 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 28px;
            transition: opacity 0.6s ease, visibility 0.6s ease;
            will-change: opacity;
        }
        :root.dark .page-loader {
            background: linear-gradient(135deg, #0d151d 0%, #121f2a 100%);
        }
        .page-loader.hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }
        .loader-ring {
            position: relative;
            width: 72px;
            height: 72px;
        }
        .loader-ring::before,
        .loader-ring::after {
            content: '';
            position: absolute;
            border-radius: 50%;
            border: 3px solid transparent;
        }
        .loader-ring::before {
            inset: 0;
            border-top-color: var(--primary-blue);
            border-right-color: var(--light-blue);
            animation: loaderSpin 1s linear infinite;
        }
        .loader-ring::after {
            inset: 10px;
            border-bottom-color: var(--primary-blue);
            border-left-color: var(--light-blue);
            animation: loaderSpin 1.4s linear infinite reverse;
        }
        .loader-center {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            animation: loaderPulse 1.8s ease-in-out infinite;
        }
        .loader-brand {
            font-size: 1.3rem;
            font-weight: 700;
            color: var(--primary-blue);
            letter-spacing: 3px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .loader-brand svg {
            animation: loaderPulse 1.8s ease-in-out infinite;
        }
        .loader-status {
            font-size: 0.82rem;
            color: var(--text-dark);
            opacity: 0.55;
            letter-spacing: 1px;
            font-weight: 500;
            min-height: 1em;
            transition: opacity 0.3s ease;
        }
        .loader-progress {
            width: 180px;
            height: 3px;
            background: rgba(30, 136, 229, 0.15);
            border-radius: 3px;
            overflow: hidden;
            position: relative;
        }
        .loader-progress-bar {
            position: absolute;
            left: 0;
            top: 0;
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, var(--primary-blue), var(--light-blue));
            border-radius: 3px;
            transition: width 0.4s cubic-bezier(0.2, 0.9, 0.4, 1);
            box-shadow: 0 0 8px rgba(30, 136, 229, 0.5);
        }
        @keyframes loaderSpin {
            to { transform: rotate(360deg); }
        }
        @keyframes loaderPulse {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.12); opacity: 0.75; }
        }

        /* ========== 通用卡片 ========== */
        .navbar, .addr-banner, .view, .footer {
            background: var(--card-bg);
            backdrop-filter: blur(var(--glass-blur)) saturate(var(--glass-saturate));
            -webkit-backdrop-filter: blur(var(--glass-blur)) saturate(var(--glass-saturate));
            border: 1px solid var(--border-light);
            box-shadow: var(--shadow-md), inset 0 0 0 1px rgba(255, 255, 255, 0.08), inset 0 0 30px rgba(255, 255, 255, 0.03);
            border-radius: var(--card-radius);
            position: relative;
            transform: translateZ(0);
            backface-visibility: hidden;
        }
        /* 页面内容在加载动画结束后才显示，避免布局跳动 */
        .container {
            opacity: 0;
            transition: opacity 0.5s ease;
        }
        .container.ready {
            opacity: 1;
        }

        /* ========== 视图切换动画（防溢出抖动） ========== */
        .view {
            display: none;
            flex-direction: column;
            gap: 24px;
            padding: 20px 24px;
            border-radius: var(--card-radius);
            overflow: hidden;
            will-change: opacity, transform;
        }
        .view.active {
            display: flex;
            animation: viewFadeIn 0.45s cubic-bezier(0.2, 0.9, 0.4, 1.1) forwards;
        }
        @keyframes viewFadeIn {
            from { opacity: 0; transform: translateY(14px) scale(0.985); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        /* ========== 导航栏 ========== */
        .navbar {
            border-radius: 40px;
            padding: 12px 24px;
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            overflow: hidden;
        }
        .nav-left { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
        .nav-right { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; justify-content: flex-end; flex: 1; }
        .navbar-brand {
            font-size: 1.2rem; font-weight: 700; color: var(--primary-blue);
            display: flex; align-items: center; gap: 8px; white-space: nowrap;
        }
        
        /* 导航链接：原有渐变选中效果 + 底部横条 */
        .nav-links {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            position: relative;
            padding: 6px 0 10px;
            overflow: hidden;
        }
        .nav-link {
            padding: 6px 16px;
            border-radius: var(--nav-btn-radius);
            font-weight: 600;
            font-size: 0.85rem;
            cursor: pointer;
            color: #757575;
            white-space: nowrap;
            text-decoration: none;
            display: inline-block;
            background: transparent;
            border: 1px solid transparent;
            position: relative;
            z-index: 1;
            transition: background 0.25s ease, color 0.25s ease, transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1),
                        box-shadow 0.3s ease, border-color 0.3s ease;
            transform: translateZ(0);
            user-select: none;
        }
        .nav-link:hover {
            background: rgba(30, 136, 229, 0.10);
            color: var(--primary-blue);
            transform: translateY(-2px) scale(1.04);
            box-shadow: 0 6px 20px rgba(30, 136, 229, 0.15);
            border-color: rgba(30, 136, 229, 0.25);
        }
        .nav-link.active {
            background: linear-gradient(135deg, var(--primary-blue), var(--light-blue));
            color: white;
            box-shadow: 0 4px 16px rgba(30, 136, 229, 0.35);
            border-color: transparent;
            transform: translateY(0) translateZ(0);
        }
        .nav-link.active:hover {
            transform: translateY(-2px) scale(1.04);
            box-shadow: 0 8px 28px rgba(30, 136, 229, 0.45);
        }
        .nav-link:active { transform: scale(0.94) translateY(2px); transition-duration: 0.06s; }
        :root.dark .nav-link { color: #b0bec5; }
        :root.dark .nav-link:hover {
            background: rgba(100, 181, 246, 0.15);
            color: var(--light-blue);
            border-color: rgba(100, 181, 246, 0.30);
        }
        :root.dark .nav-link.active {
            background: linear-gradient(135deg, var(--primary-blue), var(--light-blue));
            color: white;
        }
        :root.dark .nav-link.active:hover {
            box-shadow: 0 8px 28px rgba(100, 181, 246, 0.45);
        }

        /* 底部滑动横条 */
        .nav-indicator {
            position: absolute;
            bottom: 0;
            left: 0;
            height: 3px;
            width: 0;
            background: linear-gradient(90deg, var(--primary-blue), var(--light-blue));
            border-radius: 3px;
            box-shadow: 0 2px 8px rgba(30, 136, 229, 0.4);
            transition: left 0.4s cubic-bezier(0.34, 1.56, 0.64, 1),
                        width 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
            pointer-events: none;
            z-index: 0;
            will-change: left, width;
        }

        .settings-mini {
            display: flex; gap: 8px;
            background: rgba(0, 0, 0, 0.06);
            padding: 5px 10px; border-radius: 60px;
        }
        .icon-btn {
            background: transparent; border: none;
            padding: 6px 10px; border-radius: 40px;
            font-size: 0.9rem; cursor: pointer; color: #757575;
            transition: background 0.25s ease, color 0.25s ease, transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        .icon-btn:hover {
            background: var(--primary-blue); color: white;
            transform: translateY(-2px) scale(1.08);
        }
        .icon-btn:active { transform: scale(0.92); transition-duration: 0.06s; }
        :root.dark .icon-btn { color: #b0bec5; }
        :root.dark .icon-btn:hover { background: var(--primary-blue); color: white; }

        /* ========== 固定地址提示条 ========== */
        .addr-banner {
            padding: 14px 24px;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            border-left: 4px solid var(--primary-blue);
            animation: cardSlideUp 0.6s var(--ease-elastic) both;
            animation-delay: 0.1s;
        }
        @keyframes cardSlideUp {
            0% { opacity: 0; transform: translateY(20px) scale(0.97); }
            100% { opacity: 1; transform: translateY(0) scale(1); }
        }
        .addr-banner .addr-left {
            display: flex; align-items: center; gap: 10px;
            flex-wrap: wrap; font-size: 0.95rem; font-weight: 600;
        }
        .addr-banner .addr-icon { font-size: 1.3rem; }
        .addr-banner .fixed-addr {
            font-family: monospace; font-weight: 700;
            color: var(--primary-blue);
            background: rgba(30, 136, 229, 0.12);
            padding: 4px 14px; border-radius: 30px;
            letter-spacing: 0.5px;
            user-select: text;
            -webkit-user-select: text;
        }
        .addr-banner .copy-btn {
            background: var(--primary-blue); color: white;
            border: none; border-radius: 40px;
            padding: 6px 18px; font-size: 0.8rem;
            cursor: pointer; font-weight: 600;
            transition: background 0.2s, transform 0.15s;
        }
        .addr-banner .copy-btn:hover { background: var(--light-blue); transform: translateY(-1px); }
        .addr-banner .copy-btn:active { transform: scale(0.96); }

        /* ========== 监控面板 ========== */
        .monitor-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 16px;
        }
        .monitor-card {
            background: var(--card-bg);
            border: 1px solid var(--border-light);
            border-radius: 20px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            transition: transform 0.2s, box-shadow 0.2s, background 0.2s;
            position: relative;
            overflow: hidden;
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
        }
        .monitor-card:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-hover);
            background: var(--card-bg-hover);
        }
        .monitor-card.full-width { grid-column: 1 / -1; }
        
        .m-label {
            font-size: 0.75rem;
            color: #666;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        :root.dark .m-label { color: #90a4ae; }
        
        .m-value {
            font-size: 1.4rem;
            font-weight: 700;
            font-family: 'Segoe UI', monospace;
            display: flex;
            align-items: baseline;
            gap: 6px;
            color: var(--text-dark);
        }
        .m-value.online { color: var(--online); }
        .m-value.offline { color: var(--offline); }
        .big-num { font-size: 2.5rem; line-height: 1; }
        .sub-num { font-size: 1rem; color: #888; font-weight: 500; }
        .motd-text {
            font-size: 0.95rem;
            font-family: inherit;
            word-break: break-all;
            line-height: 1.5;
            color: var(--text-dark);
            opacity: 0.9;
            white-space: pre-wrap;
        }

        .status-dot {
            display: inline-block;
            width: 10px; height: 10px;
            border-radius: 50%;
            margin-right: 6px;
        }
        .status-dot.online { background: var(--online); animation: pulse 1.8s infinite; }
        .status-dot.offline { background: var(--offline); }

        .server-icon-img {
            width: 64px;
            height: 64px;
            border-radius: 12px;
            image-rendering: pixelated;
            border: 2px solid rgba(255, 255, 255, 0.15);
            display: block;
        }

        /* ========== 公告 ========== */
        .announcement-list { display: flex; flex-direction: column; gap: 16px; }
        .announcement-card {
            background: var(--card-bg);
            border: 1px solid var(--border-light);
            border-radius: 20px;
            padding: 18px 22px;
            transition: background 0.25s, transform 0.2s, border-color 0.25s, box-shadow 0.25s;
            position: relative;
            overflow: hidden;
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
        }
        .announcement-card:hover {
            background: var(--card-bg-hover);
            border-color: var(--border-light-hover);
            transform: translateY(-2px);
            box-shadow: var(--shadow-hover);
        }
        .announcement-card.pinned { border-left: 4px solid #ff9800; }
        .announcement-card .a-head {
            display: flex; flex-wrap: wrap; align-items: center;
            justify-content: space-between; gap: 8px; margin-bottom: 6px;
        }
        .announcement-card .a-title {
            font-size: 1.1rem; font-weight: 700; color: var(--text-dark);
            display: flex; align-items: center; gap: 8px;
        }
        .announcement-card .pin-tag {
            font-size: 0.7rem; background: #ff9800; color: white;
            padding: 2px 10px; border-radius: 30px; font-weight: 700;
        }
        .announcement-card .a-date {
            font-size: 0.78rem; opacity: 0.6; font-weight: 600;
            white-space: nowrap; display: flex; align-items: center; gap: 4px;
        }
        .announcement-card .a-content {
            font-size: 0.95rem; line-height: 1.7;
            white-space: pre-wrap; word-break: break-word;
            opacity: 0.9; margin-top: 8px;
        }
        .announcement-card .a-tags {
            margin-top: 12px; display: flex; flex-wrap: wrap; gap: 6px;
        }
        .announcement-card .a-tag {
            font-size: 0.72rem; padding: 2px 12px; border-radius: 30px;
            background: rgba(30, 136, 229, 0.12); color: var(--primary-blue); font-weight: 600;
        }

        /* ========== 其他内容 ========== */
        .other-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 18px;
        }
        .other-card {
            background: var(--card-bg);
            border: 1px solid var(--border-light);
            border-radius: 20px;
            padding: 20px;
            display: flex; flex-direction: column; gap: 10px;
            transition: background 0.25s, transform 0.2s, border-color 0.25s, box-shadow 0.25s;
            text-decoration: none; color: inherit; position: relative; overflow: hidden;
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
        }
        .other-card.clickable { cursor: pointer; }
        .other-card:hover {
            background: var(--card-bg-hover);
            border-color: var(--border-light-hover);
            transform: translateY(-3px);
            box-shadow: var(--shadow-hover);
        }
        .other-card .o-head { display: flex; align-items: center; gap: 12px; }
        .other-card .o-icon {
            font-size: 2rem; line-height: 1;
            width: 52px; height: 52px;
            display: flex; align-items: center; justify-content: center;
            border-radius: 14px; background: rgba(30, 136, 229, 0.12); flex-shrink: 0;
        }
        .other-card .o-info { flex: 1; min-width: 0; }
        .other-card .o-name {
            font-size: 1.05rem; font-weight: 700;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }
        .other-card .o-type {
            font-size: 0.72rem; font-weight: 600;
            margin-top: 2px; opacity: 0.6; letter-spacing: 0.3px;
        }
        .other-card .o-desc {
            font-size: 0.9rem; line-height: 1.6;
            opacity: 0.85; word-break: break-word;
        }
        .other-card .o-footer {
            display: flex; align-items: center;
            justify-content: space-between; margin-top: 4px;
            gap: 8px; flex-wrap: wrap;
        }
        .other-card .o-link {
            font-size: 0.8rem; color: var(--primary-blue);
            font-weight: 600; display: inline-flex;
            align-items: center; gap: 4px; text-decoration: none;
        }
        .other-card .o-link:hover { text-decoration: underline; }
        .other-card .o-arrow {
            font-size: 1.1rem; opacity: 0.5; transition: transform 0.2s;
        }
        .other-card:hover .o-arrow { transform: translateX(4px); opacity: 1; }

        /* ========== 通用状态 ========== */
        .empty-state, .loading-state {
            text-align: center; padding: 50px 20px;
            opacity: 0.65; font-size: 0.95rem;
        }
        .empty-state .big-icon { font-size: 3rem; display: block; margin-bottom: 12px; }
        .loading-state { font-size: 1rem; }

        /* ========== 页脚 ========== */
        .footer {
            margin-top: auto;
            border-radius: var(--card-radius) var(--card-radius) 0 0;
            box-shadow: var(--shadow-md);
            text-align: center;
            padding: 20px;
            animation: cardSlideUp 0.6s var(--ease-elastic) both;
            animation-delay: 0.2s;
        }
        .footer-content {
            display: flex; flex-direction: column;
            align-items: center; gap: 6px; font-size: 0.85rem;
        }
        .footer-line {
            display: flex; flex-wrap: wrap; justify-content: center;
            align-items: center; gap: 6px 12px;
        }
        .footer-line a { color: var(--primary-blue); text-decoration: none; transition: 0.2s; }
        .footer-line a:hover { text-decoration: underline; }
        .footer-divider { color: #757575; opacity: 0.25; user-select: none; }
        :root.dark .footer-divider { color: #b0bec5; }

        /* ========== 通用按钮 ========== */
        .btn {
            background: var(--primary-blue); border: none;
            padding: 8px 18px; border-radius: 50px;
            font-weight: 700; color: white; cursor: pointer;
            font-size: 0.85rem; transition: background 0.2s, transform 0.1s, box-shadow 0.2s;
            display: inline-flex; align-items: center; gap: 6px;
            user-select: none;
        }
        .btn:hover { background: var(--light-blue); transform: translateY(-1px); box-shadow: var(--shadow-hover); }

    <script>
        (function() {
            "use strict";

            const FIXED_ADDR = 'zszzz.eu.cc';

            const BG_APIS = [
                'https://www.loliapi.com/acg/',

            const PRELOAD_TIMEOUT = 6000; // 加载动画最长等待

            // ============================================================

            // ============================================================
            const i18n = {
                zh: {
                    brand: "无名小服", nav_home: "主页", nav_announcements: "公告", nav_sponsors: "其他",
                    monitor_title: "服务器性能监控", refresh: "刷新", copy: "📋 复制",
                    copy_success: "✅ 已复制!", copy_fail: "复制失败，请手动复制",

                    players: "在线玩家", latency: "延迟", version: "版本", motd: "MOTD",
                    server_addr_label: "服务器地址", announcements_title: "公告", loading: "加载中...",

                    first_visit_text: "欢迎访问无名小服官网 · QQ交流群：1083805903",
                    first_visit_btn: "我知道了", err_offline: "无法连接到服务器"
                },
                en: {
                    brand: "Nameless Server", nav_home: "Home", nav_announcements: "News", nav_sponsors: "Other",
                    monitor_title: "Server Performance Monitor", refresh: "Refresh", copy: "📋 Copy",
                    copy_success: "✅ Copied!", copy_fail: "Copy failed",
                    status: "Status", status_online: "Online", status_offline: "Offline", status_starting: "Starting",
                    players: "Players", latency: "Latency", version: "Version", motd: "MOTD",
                    server_addr_label: "Server Address", announcements_title: "Announcements", loading: "Loading...",
                    empty_ann_title: "No announcements", empty_ann_desc: "There are no announcements yet. Please check back later.",
                    pin: "Pinned", no_title: "Untitled",
                    other_title: "Other", empty_other_title: "No content", empty_other_desc: "There is no content yet. Please check back later.",
                    visit: "Visit", unnamed: "Unnamed",
                    type_friend: "Friend Link", type_sponsor: "Sponsor", type_tool: "Tool", type_other: "Other",
                    first_visit_title: "🎉 Welcome to Nameless Server",
                    first_visit_text: "Welcome to Nameless Server · QQ Group: 1083805903",
                    first_visit_btn: "Got it", err_offline: "Cannot connect to server"
                }
            };

            let currentLang = 'zh';
            let announcementsData = [];
            let otherData = [];

            // ============================================================
            //  DOM 引用（集中缓存，避免重复查询）
            // ============================================================
            const d = {
                pageLoader: document.getElementById('pageLoader'),
                loaderBar: document.getElementById('loaderBar'),
                loaderStatus: document.getElementById('loaderStatus'),
                mainContainer: document.getElementById('mainContainer'),
                statusDot: document.getElementById('statusDot'),
                statusText: document.getElementById('statusText'),
                playersValue: document.getElementById('playersValue'),
                maxPlayers: document.getElementById('maxPlayers'),
                latencyValue: document.getElementById('latencyValue'),
                versionValue: document.getElementById('versionValue'),
                motdValue: document.getElementById('motdValue'),
                serverIcon: document.getElementById('serverIcon'),
                refreshServersBtn: document.getElementById('refreshServersBtn'),
                darkBtn: document.getElementById('darkModeBtn'),
                langBtn: document.getElementById('langBtn'),
                forceRefreshBtn: document.getElementById('forceRefreshBtn'),
                firstVisitConfirm: document.getElementById('firstVisitConfirm'),
                firstVisitModal: document.getElementById('firstVisitModal'),
                copyFixedAddrBtn: document.getElementById('copyFixedAddrBtn'),
                annContainer: document.getElementById('announcementsContainer'),
                annCountBadge: document.getElementById('annCountBadge'),
                refreshAnnBtn: document.getElementById('refreshAnnBtn'),
                otherContainer: document.getElementById('otherContainer'),
                otherCountBadge: document.getElementById('otherCountBadge'),
                refreshOtherBtn: document.getElementById('refreshOtherBtn'),
                navLinks: document.getElementById('navLinks'),
                navIndicator: document.getElementById('navIndicator')
            };

            // ============================================================
            //  工具
            // ============================================================
            const t = (key) => (i18n[currentLang] && i18n[currentLang][key] !== undefined) ? i18n[currentLang][key] : key;

            function escapeHtml(str) {
                return String(str == null ? '' : str)
                    .replace(/&/g, '&amp;').replace(/</g, '&lt;')
                    .replace(/>/g, '&gt;').replace(/"/g, '&quot;')
                    .replace(/'/g, '&#39;');
            }
            function formatDate(str) {
                if (!str) return '';
                try {
                    const dt = new Date(str);
                    if (isNaN(dt.getTime())) return str;
                    return `${dt.getFullYear()}-${String(dt.getMonth() + 1).padStart(2, '0')}-${String(dt.getDate()).padStart(2, '0')}`;
                } catch { return str; }
            }
            function getTypeLabel(type) {
                const map = { friend: 'type_friend', sponsor: 'type_sponsor', tool: 'type_tool' };
                return t(map[type] || 'type_other');
            }

            // 节流：使用 requestAnimationFrame
            function rafThrottle(fn) {
                let ticking = false;
                return function(...args) {
                    if (!ticking) {
                        ticking = true;
                        requestAnimationFrame(() => {
                            fn.apply(this, args);
                            ticking = false;
                        });
                    }
                };
            }

            // 防抖
            function debounce(fn, delay) {
                let timer;
                return function(...args) {
                    clearTimeout(timer);
                    timer = setTimeout(() => fn.apply(this, args), delay);
                };
            }

            // ============================================================
            //  加载动画进度控制
            // ============================================================
            function setLoaderProgress(percent, status) {
                d.loaderBar.style.width = percent + '%';
                if (status) d.loaderStatus.innerText = status;
            }
            function hideLoader() {
                setLoaderProgress(100, '准备就绪');
                setTimeout(() => {
                    d.pageLoader.classList.add('hidden');
                    d.mainContainer.classList.add('ready');
                    // 初始化导航横条
                    requestAnimationFrame(() => {
                        updateIndicator();
                        setTimeout(updateIndicator, 100);
                    });
                }, 300);
            }

            // ============================================================
            //  随机背景图（Promise 化）
            // ============================================================
            function setRandomBackground() {
                return new Promise((resolve) => {
                    const tryLoad = (apis, index = 0) => {
                        if (index >= apis.length) {
                            // 全部失败，使用渐变
                            document.body.style.backgroundImage = 'linear-gradient(135deg, var(--bg-start), var(--bg-end))';
                            resolve(null);
                            return;
                        }
                        const api = apis[index];
                        const img = new Image();
                        let settled = false;
                        const finish = (src) => {
                            if (settled) return;
                            settled = true;
                            if (src) {
                                document.body.style.backgroundImage = `url(${src})`;
                                resolve(src);
                            } else {
                                tryLoad(apis, index + 1);
                            }
                        };
                        // 5 秒超时
                        const timer = setTimeout(() => finish(null), 5000);
                        img.onload = () => { clearTimeout(timer); finish(img.src); };
                        img.onerror = () => { clearTimeout(timer); finish(null); };
                        img.src = api + (api.includes('?') ? '&' : '?') + 't=' + Date.now();
                    };
                    // 随机起点
                    const shuffled = BG_APIS.slice().sort(() => Math.random() - 0.5);
                    tryLoad(shuffled);
                });
            }

            // ============================================================
            //  复制 & Toast（DOM 复用，避免频繁创建）
            // ============================================================
            let toastEl = null;
            let toastTimer = null;
            function showToast(msg) {
                if (!toastEl) {
                    toastEl = document.createElement('div');
                    toastEl.className = 'toast-msg';
                    document.body.appendChild(toastEl);
                }
                toastEl.innerText = msg;
                toastEl.style.opacity = '1';
                clearTimeout(toastTimer);
                toastTimer = setTimeout(() => {
                    toastEl.style.opacity = '0';
                }, 2500);
            }

            async function copyText(text) {
                try {
                    if (navigator.clipboard && navigator.clipboard.writeText) {
                        await navigator.clipboard.writeText(text);
                    } else {
                        const ta = document.createElement('textarea');
                        ta.value = text;
                        ta.setAttribute('readonly', '');
                        ta.style.position = 'absolute';
                        ta.style.left = '-9999px';
                        document.body.appendChild(ta);
                        ta.select();
                        document.execCommand('copy');
                        document.body.removeChild(ta);
                    }
                    showToast(t('copy_success'));
                    return true;
                } catch {
                    showToast(t('copy_fail'));
                    return false;
                }
            }

            // ============================================================
            //  真实 API：mcstatus.io
            // ============================================================
            async function fetchServerStatus(address) {
                const startTime = performance.now();
                try {
                    const url = API_BASE + encodeURIComponent(address);
                    const controller = new AbortController();
                    const timeoutId = setTimeout(() => controller.abort(), 10000);
                    const resp = await fetch(url, { signal: controller.signal });
                    clearTimeout(timeoutId);
                    const latency = Math.round(performance.now() - startTime);
                    if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
                    const data = await resp.json();
                    return {
                        online: !!data.online,
                        players: data.players?.online || 0,
                        max: data.players?.max || 0,
                        latency,
                        version: data.version?.name_clean || data.version?.name_raw || '未知',
                        motd: data.motd?.clean || data.motd?.raw || '',
                        icon: data.icon || null
                    };
                } catch (e) {
                    console.warn(`获取 ${address} 状态失败:`, e);
                    return { online: false, players: 0, max: 0, latency: null, version: '未知', motd: '', icon: null };
                }
            }

            // ============================================================
            //  刷新监控面板
            // ============================================================
            async function refreshMonitor(showToastMsg) {
                const status = await fetchServerStatus(FIXED_ADDR);
                const isOnline = status.online;

                d.statusDot.className = `status-dot ${isOnline ? 'online' : 'offline'}`;
                d.statusText.innerText = isOnline ? t('status_online') : t('status_offline');
                d.statusText.className = isOnline ? '' : 'offline';
                d.playersValue.innerText = isOnline ? status.players : '--';
                d.maxPlayers.innerText = isOnline ? status.max : '--';
                d.latencyValue.innerText = isOnline && status.latency !== null ? `${status.latency} ms` : '-- ms';
                d.versionValue.innerText = isOnline ? (status.version || '未知') : '未知';
                d.motdValue.innerText = isOnline ? (status.motd || '暂无数据') : '暂无数据';

                if (isOnline && status.icon) {
                    d.serverIcon.src = status.icon;
                    d.serverIcon.style.display = 'block';
                } else {
                    d.serverIcon.style.display = 'none';
                    d.serverIcon.removeAttribute('src');
                }

                if (showToastMsg) {
                    showToast(isOnline
                        ? `✅ 已刷新 · 在线 · ${status.players}/${status.max} 玩家 · ${status.latency}ms`
                        : `❌ ${t('err_offline')}`);
                }
            }

            // ============================================================
            //  加载 JSON
            // ============================================================
            async function loadAnnouncements() {
                try {
                    const resp = await fetch('announcements.json?' + Date.now());
                    if (!resp.ok) throw new Error('HTTP ' + resp.status);
                    const json = await resp.json();
                    let list = json.announcements || json;
                    if (!Array.isArray(list)) list = [];
                    list.sort((a, b) => {
                        const pa = a.pinned ? 1 : 0;
                        const pb = b.pinned ? 1 : 0;
                        if (pa !== pb) return pb - pa;
                        const da = a.date ? new Date(a.date).getTime() : 0;
                        const db = b.date ? new Date(b.date).getTime() : 0;
                        return db - da;
                    });
                    announcementsData = list;
                    return true;
                } catch (e) {
                    console.warn('读取 announcements.json 失败:', e);
                    announcementsData = [];
                    return false;
                }
            }
            async function loadOther() {
                try {
                    const resp = await fetch('sponsors.json?' + Date.now());
                    if (!resp.ok) throw new Error('HTTP ' + resp.status);
                    const json = await resp.json();
                    let list = json.items || json.sponsors || json;
                    if (!Array.isArray(list)) list = [];
                    otherData = list;
                    return true;
                } catch (e) {
                    console.warn('读取 sponsors.json 失败:', e);
                    otherData = [];
                    return false;
                }
            }

            // ============================================================
            //  渲染：公告（使用 DocumentFragment 优化）
            // ============================================================
            function renderAnnouncements() {
                const list = announcementsData;
                d.annCountBadge.innerText = list.length;

                if (list.length === 0) {
                    d.annContainer.innerHTML = `
                        <div class="empty-state">
                            <span class="big-icon">📭</span>
                            <div style="font-weight:700; margin-bottom:6px;">${escapeHtml(t('empty_ann_title'))}</div>
                            <div style="font-size:0.85rem; opacity:0.7;">${escapeHtml(t('empty_ann_desc'))}</div>
                        </div>`;
                    return;
                }
                d.annContainer.innerHTML = `<div class="announcement-list">${
                    list.map(a => {
                        const pinned = a.pinned ? 'pinned' : '';
                        const pinTag = a.pinned ? `<span class="pin-tag">${escapeHtml(t('pin'))}</span>` : '';
                        const tags = Array.isArray(a.tags) && a.tags.length > 0
                            ? `<div class="a-tags">${a.tags.map(tag => `<span class="a-tag">${escapeHtml(tag)}</span>`).join('')}</div>`
                            : '';
                        return `
                            <div class="announcement-card ${pinned}">
                                <div class="a-head">
                                    <div class="a-title">${pinTag}${escapeHtml(a.title || t('no_title'))}</div>
                                    <div class="a-date">📅 ${escapeHtml(formatDate(a.date))}</div>
                                </div>
                                <div class="a-content">${escapeHtml(a.content || '')}</div>
                                ${tags}
                            </div>`;
                    }).join('')
                }</div>`;
            }

            // ============================================================
            //  渲染：其他（事件委托替代逐个绑定）
            // ============================================================
            function renderOther() {
                const list = otherData;
                d.otherCountBadge.innerText = list.length;

                if (list.length === 0) {
                    d.otherContainer.innerHTML = `
                        <div class="empty-state">
                            <span class="big-icon">📭</span>
                            <div style="font-weight:700; margin-bottom:6px;">${escapeHtml(t('empty_other_title'))}</div>
                            <div style="font-size:0.85rem; opacity:0.7;">${escapeHtml(t('empty_other_desc'))}</div>
                        </div>`;
                    return;
                }
                d.otherContainer.innerHTML = list.map(item => {
                    const hasUrl = item.url && item.url.trim() !== '';
                    const clickable = hasUrl ? 'clickable' : '';
                    const dataUrl = hasUrl ? `data-url="${escapeHtml(item.url)}"` : '';
                    const linkHtml = hasUrl
                        ? `<a class="o-link" href="${escapeHtml(item.url)}" target="_blank" rel="noopener noreferrer" data-stop="1">🔗 ${escapeHtml(t('visit'))}</a>
                           <span class="o-arrow">→</span>`
                        : '';
                    return `
                        <div class="other-card ${clickable}" ${dataUrl}>
                            <div class="o-head">
                                <div class="o-icon">${escapeHtml(item.icon || '✨')}</div>
                                <div class="o-info">
                                    <div class="o-name">${escapeHtml(item.name || t('unnamed'))}</div>
                                    <div class="o-type">${escapeHtml(getTypeLabel(item.type))}</div>
                                </div>
                            </div>
                            <div class="o-desc">${escapeHtml(item.description || '')}</div>
                            <div class="o-footer">${linkHtml}</div>
                        </div>`;
                }).join('');
            }

            // 使用事件委托处理其他卡片的点击（只绑定一次）
            let otherDelegateBound = false;
            function bindOtherDelegate() {
                if (otherDelegateBound) return;
                otherDelegateBound = true;
                d.otherContainer.addEventListener('click', (e) => {
                    // 点击链接则不触发卡片
                    if (e.target.closest('[data-stop]')) return;
                    const card = e.target.closest('.other-card.clickable');
                    if (!card) return;
                    const url = card.dataset.url;
                    if (url) window.open(url, '_blank');
                });
            }

            // ============================================================
            //  视图切换 + 底部横条同步滑动
            // ============================================================
            const updateIndicator = rafThrottle(function() {
                const active = document.querySelector('.nav-link.active');
                if (!active || !d.navIndicator) return;
                const parentRect = d.navLinks.getBoundingClientRect();
                const rect = active.getBoundingClientRect();
                d.navIndicator.style.left = (rect.left - parentRect.left) + 'px';
                d.navIndicator.style.width = rect.width + 'px';
            });

            function switchView(viewName) {
                document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
                const target = document.getElementById('view-' + viewName);
                if (target) target.classList.add('active');
                document.querySelectorAll('.nav-link[data-view]').forEach(l => {
                    l.classList.toggle('active', l.dataset.view === viewName);
                });
                requestAnimationFrame(updateIndicator);
            }

            // ============================================================
            //  深色模式
            // ============================================================
            function toggleDarkMode() {
                const targetDark = !document.documentElement.classList.contains('dark');
                document.documentElement.classList.toggle('dark', targetDark);
                localStorage.setItem('darkMode', targetDark ? 'true' : 'false');
                d.darkBtn.innerHTML = targetDark ? '☀️' : '🌙';
            }

            // ============================================================
            //  语言切换
            // ============================================================
            function switchLanguage() {
                const newLang = currentLang === 'zh' ? 'en' : 'zh';
                currentLang = newLang;
                localStorage.setItem('lang', newLang);
                const elements = document.querySelectorAll('[data-i18n]');
                elements.forEach(el => el.classList.add('i18n-fade-out'));
                setTimeout(() => {
                    elements.forEach(el => {
                        const key = el.dataset.i18n;
                        if (i18n[newLang] && i18n[newLang][key] !== undefined) {
                            if (el.tagName === 'INPUT' || el.tagName === 'TEXTAREA') {
                                el.placeholder = i18n[newLang][key];
                            } else {
                                el.innerText = i18n[newLang][key];
                            }
                        }
                        el.classList.remove('i18n-fade-out');
                        el.classList.add('i18n-fade-in');
                    });
                    setTimeout(() => elements.forEach(el => el.classList.remove('i18n-fade-in')), 250);

                    refreshMonitor(false);
                    renderAnnouncements();
                    renderOther();
                    requestAnimationFrame(updateIndicator);

                    d.langBtn.title = newLang === 'zh' ? '切换至英文' : 'Switch to Chinese';
                }, 200);
            }

            // ============================================================
            //  首次访问弹窗
            // ============================================================
            function closeFirstVisit(e) {
                if (e) e.stopPropagation();
                if (d.firstVisitModal) {
                    d.firstVisitModal.style.visibility = 'hidden';
                    d.firstVisitModal.querySelector('div').style.transform = 'translateY(100%)';
                    localStorage.setItem('first_visit_warning', 'true');
                }
            }
            function firstVisit() {
                if (!localStorage.getItem('first_visit_warning') && d.firstVisitModal) {
                    d.firstVisitModal.style.display = 'flex';
                    requestAnimationFrame(() => {
                        d.firstVisitModal.style.visibility = 'visible';
                        d.firstVisitModal.querySelector('div').style.transform = 'translateY(0)';
                    });
                }
            }

            // ============================================================
            //  预加载所有资源
            // ============================================================
            async function preloadAll() {
                const tasks = [
                    (async () => {
                        setLoaderProgress(15, '正在加载背景...');
                        await setRandomBackground();
                        setLoaderProgress(35, '背景加载完成');
                    })(),
                    (async () => {
                        setLoaderProgress(40, '正在查询服务器状态...');
                        await refreshMonitor(false);
                        setLoaderProgress(65, '服务器状态已获取');
                    })(),
                    (async () => {
                        await loadAnnouncements();
                        renderAnnouncements();
                        setLoaderProgress(80, '公告已加载');
                    })(),
                    (async () => {
                        await loadOther();
                        renderOther();
                        setLoaderProgress(95, '内容已加载');
                    })()
                ];

                // 限时完成，超时后也进入主界面
                const timeout = new Promise(resolve => setTimeout(resolve, PRELOAD_TIMEOUT));
                await Promise.race([Promise.allSettled(tasks), timeout]);

                // 保证所有渲染都执行
                renderAnnouncements();
                renderOther();
                bindOtherDelegate();
            }

            // ============================================================
            //  初始化
            // ============================================================
            async function init() {
                // 语言
                currentLang = localStorage.getItem('lang') || 'zh';
                document.querySelectorAll('[data-i18n]').forEach(el => {
                    const key = el.dataset.i18n;
                    if (i18n[currentLang] && i18n[currentLang][key] !== undefined) {
                        if (el.tagName === 'INPUT' || el.tagName === 'TEXTAREA') {
                            el.placeholder = i18n[currentLang][key];
                        } else {
                            el.innerText = i18n[currentLang][key];
                        }
                    }
                });
                d.langBtn.title = currentLang === 'zh' ? '切换至英文' : 'Switch to Chinese';

                // 深色
                const isDark = document.documentElement.classList.contains('dark');
                d.darkBtn.innerHTML = isDark ? '☀️' : '🌙';
                d.darkBtn.addEventListener('click', toggleDarkMode);

                // 导航切换
                document.querySelectorAll('.nav-link[data-view]').forEach(link => {
                    link.addEventListener('click', function(e) {
                        e.preventDefault();
                        switchView(this.dataset.view);
                    });
                });

                // 复制按钮
                d.copyFixedAddrBtn.addEventListener('click', () => copyText(FIXED_ADDR));

                // 刷新按钮
                d.refreshServersBtn.addEventListener('click', () => refreshMonitor(true));
                d.refreshAnnBtn.addEventListener('click', async () => {
                    await loadAnnouncements();
                    renderAnnouncements();
                    showToast('✅ 已刷新公告');
                });
                d.refreshOtherBtn.addEventListener('click', async () => {
                    await loadOther();
                    renderOther();
                    showToast('✅ 已刷新');
                });

                d.langBtn.addEventListener('click', switchLanguage);
                d.forceRefreshBtn.addEventListener('click', () => location.reload());
                d.firstVisitConfirm.addEventListener('click', closeFirstVisit);

                // 使用 passive 提升滚动性能
                window.addEventListener('resize', debounce(updateIndicator, 120), { passive: true });
                window.addEventListener('orientationchange', debounce(updateIndicator, 120), { passive: true });

                // 预加载所有资源并隐藏加载动画
                await preloadAll();
                hideLoader();

                // 首次访问弹窗
                setTimeout(firstVisit, 800);

                // 定时刷新（每 30 秒）
                setInterval(() => { refreshMonitor(false); }, 30000);

                console.log('✅ 无名小服 前端已启动（预加载优化版）');
            }

            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', init, { once: true });
            } else {
                init();
            }
        })();
    </script>
</body>
</html>
