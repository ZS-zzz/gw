<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover" />
    <title>无名小服 · 公告</title>
    <script>
        (function() {
            if (localStorage.getItem('darkMode') === 'true') {
                document.documentElement.classList.add('dark');
            }
        })();

    <style>
        :root {
            --primary-blue: #1e88e5;
            --light-blue: #42a5f5;
            --text-dark: #333333;
            --card-bg: rgba(255, 255, 255, 0.08);
            --card-bg-hover: rgba(255, 255, 255, 0.18);
            --bg-start: #f5f9ff;
            --bg-end: #e3f2fd;
            --border-light: rgba(255, 255, 255, 0.30);
            --border-light-hover: rgba(255, 255, 255, 0.60);
            --shadow-md: 0 8px 32px rgba(0, 0, 0, 0.10), 0 2px 8px rgba(0, 0, 0, 0.04);
            --shadow-lg: 0 16px 56px rgba(0, 0, 0, 0.16), 0 8px 24px rgba(0, 0, 0, 0.06);
            --shadow-hover: 0 20px 64px rgba(0, 0, 0, 0.20), 0 8px 28px rgba(0, 0, 0, 0.08);
            --ease-elastic: cubic-bezier(0.34, 1.56, 0.64, 1);
            --glass-blur: 12px;
            --glass-saturate: 200%;
            --nav-btn-radius: 40px;
            --card-radius: 32px;
        }
        :root.dark {
            --primary-blue: #64b5f6;
            --light-blue: #90caf9;
            --text-dark: #eef4ff;
            --card-bg: rgba(255, 255, 255, 0.06);
            --card-bg-hover: rgba(255, 255, 255, 0.14);
            --border-light: rgba(255, 255, 255, 0.15);
            --border-light-hover: rgba(255, 255, 255, 0.35);
            --shadow-md: 0 8px 32px rgba(0, 0, 0, 0.6), 0 2px 8px rgba(0, 0, 0, 0.3);
            --shadow-lg: 0 16px 56px rgba(0, 0, 0, 0.8), 0 8px 24px rgba(0, 0, 0, 0.4);
            --shadow-hover: 0 20px 64px rgba(0, 0, 0, 0.9), 0 8px 28px rgba(0, 0, 0, 0.5);
            --bg-start: #121f2a;
            --bg-end: #1a2c36;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            background: linear-gradient(135deg, var(--bg-start) 0%, var(--bg-end) 100%);
            color: var(--text-dark);
            font-family: 'Segoe UI', 'Microsoft YaHei', system-ui, sans-serif;
            min-height: 100vh;
            padding: 12px 12px 0 12px;
            transition: background 0.4s ease, color 0.3s ease;
            overflow-x: hidden;
            user-select: none;
            -webkit-user-select: none;
            -webkit-font-smoothing: antialiased;
        }
        .container { max-width: 1100px; margin: 0 auto; display: flex; flex-direction: column; gap: 24px; }

        .navbar, .addr-banner, .announcements-section, .footer {
            background: var(--card-bg);
            backdrop-filter: blur(var(--glass-blur)) saturate(var(--glass-saturate));
            -webkit-backdrop-filter: blur(var(--glass-blur)) saturate(var(--glass-saturate));
            border: 1px solid var(--border-light);
            box-shadow: var(--shadow-md), inset 0 0 0 1px rgba(255, 255, 255, 0.08), inset 0 0 30px rgba(255, 255, 255, 0.03);
            border-radius: var(--card-radius);
            animation: cardSlideUp 0.7s var(--ease-elastic) both;
        }
        @keyframes cardSlideUp {
            0% { opacity: 0; transform: translateY(20px) scale(0.97) rotate(-0.5deg); }
            60% { opacity: 1; transform: translateY(-4px) scale(1.005) rotate(0.2deg); }
            100% { opacity: 1; transform: translateY(0) scale(1) rotate(0deg); }
        }

        /* ====== 导航栏 ====== */
        .navbar {
            border-radius: 40px;
            padding: 12px 24px;
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            animation-delay: 0s;
        }
        .nav-left { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
        .nav-right { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; justify-content: flex-end; flex: 1; }
        .navbar-brand {
            font-size: 1.2rem; font-weight: 700; color: var(--primary-blue);
            display: flex; align-items: center; gap: 8px; white-space: nowrap;
        }
        .nav-links { display: flex; gap: 8px; flex-wrap: wrap; }
        .nav-link {
            padding: 6px 16px; border-radius: var(--nav-btn-radius);
            font-weight: 600; font-size: 0.85rem; cursor: pointer;
            color: #757575; white-space: nowrap; text-decoration: none;
            display: inline-block; background: transparent; border: 1px solid transparent;
            transition: background 0.25s ease, color 0.25s ease, transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1),
                        box-shadow 0.3s ease, border-color 0.3s ease;
        }
        .nav-link:hover {
            background: rgba(30, 136, 229, 0.10);
            color: var(--primary-blue);
            transform: translateY(-2px) scale(1.04);
            box-shadow: 0 6px 20px rgba(30, 136, 229, 0.15);
            border-color: rgba(30, 136, 229, 0.25);
        }
        .nav-link.active {
            background: linear-gradient(135deg, var(--primary-blue), var(--light-blue));
            color: white;
            box-shadow: 0 4px 16px rgba(30, 136, 229, 0.35);
        }
        :root.dark .nav-link { color: #b0bec5; }
        :root.dark .nav-link:hover {
            background: rgba(100, 181, 246, 0.15);
            color: var(--light-blue);
        }
        :root.dark .nav-link.active {
            background: linear-gradient(135deg, var(--primary-blue), var(--light-blue));
            color: white;
        }
        .settings-mini {
            display: flex; gap: 8px;
            background: rgba(0, 0, 0, 0.04);
            padding: 5px 10px; border-radius: 60px;
        }
        .icon-btn {
            background: transparent; border: none;
            padding: 6px 10px; border-radius: 40px;
            font-size: 0.9rem; cursor: pointer; color: #757575;
            transition: background 0.25s ease, color 0.25s ease, transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        .icon-btn:hover {
            background: var(--primary-blue); color: white;
            transform: translateY(-2px) scale(1.08);
        }
        :root.dark .icon-btn { color: #b0bec5; }
        :root.dark .icon-btn:hover { background: var(--primary-blue); color: white; }
        .music-controls { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
        .music-btn {
            background: var(--primary-blue); border: none; border-radius: 40px;
            padding: 8px 16px; color: white; cursor: pointer;
            display: flex; align-items: center; gap: 6px;
            font-size: 0.85rem; font-weight: 600;
            transition: background 0.25s ease, transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
            white-space: nowrap;
        }
        .music-btn:hover { background: var(--light-blue); transform: translateY(-2px) scale(1.04); }
        .music-btn.playing { background: #ff9800; }
        .volume-slider-container {
            display: flex; align-items: center; gap: 4px;
            background: rgba(0, 0, 0, 0.05); border-radius: 40px; padding: 4px 10px;
        }
        .volume-label { font-size: 0.9rem; line-height: 1; }
        .volume-slider {
            -webkit-appearance: none; appearance: none;
            width: 70px; height: 4px; border-radius: 4px;
            background: #e0e0e0; outline: none; cursor: pointer;
        }
        .volume-slider::-webkit-slider-thumb {
            -webkit-appearance: none; width: 16px; height: 16px;
            border-radius: 50%; background: var(--primary-blue);
        }
        :root.dark .volume-slider { background: #3a4e55; }

        /* ====== 固定地址提示条 ====== */
        .addr-banner {
            animation-delay: 0.06s;
            padding: 14px 24px;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            border-left: 4px solid var(--primary-blue);
        }
        .addr-banner .addr-left {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
            font-size: 0.95rem;
            font-weight: 600;
        }
        .addr-banner .addr-icon { font-size: 1.3rem; }
        .addr-banner .fixed-addr {
            font-family: monospace;
            font-weight: 700;
            color: var(--primary-blue);
            background: rgba(30, 136, 229, 0.10);
            padding: 4px 14px;
            border-radius: 30px;
            letter-spacing: 0.5px;
        }
        .addr-banner .copy-btn {
            background: var(--primary-blue); color: white;
            border: none; border-radius: 40px;
            padding: 6px 18px; font-size: 0.8rem;
            cursor: pointer; font-weight: 600;
            transition: background 0.2s, transform 0.15s;
        }
        .addr-banner .copy-btn:hover { background: var(--light-blue); transform: translateY(-1px); }
        .addr-banner .copy-btn:active { transform: scale(0.96); }

        /* ====== 公告区域 ====== */
        .announcements-section {
            animation-delay: 0.12s;
            padding: 20px 24px 24px;
        }
        .announcements-header {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            margin-bottom: 20px;
            padding-bottom: 14px;
            border-bottom: 1px solid var(--border-light);
        }
        .announcements-header h2 {
            margin: 0;
            font-size: 1.3rem;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .announcements-header .badge {
            background: rgba(255, 255, 255, 0.08);
            padding: 3px 14px;
            border-radius: 40px;
            font-size: 0.8rem;
            font-weight: 600;
            border: 1px solid var(--border-light);
        }
        .btn {
            background: var(--primary-blue);
            border: none; padding: 8px 18px;
            border-radius: 50px; font-weight: 700;
            color: white; cursor: pointer;
            font-size: 0.85rem;
            transition: background 0.2s, transform 0.1s, box-shadow 0.2s;
            display: inline-flex; align-items: center; gap: 6px;
        }
        .btn:hover { background: var(--light-blue); transform: translateY(-1px); box-shadow: var(--shadow-hover); }
        .btn:active { transform: scale(0.97); }
        .btn-ghost {
            background: transparent; color: var(--text-dark);
            border: 1px solid var(--border-light);
        }
        .btn-ghost:hover { background: var(--card-bg-hover); color: var(--primary-blue); }

        .announcement-list {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        .announcement-card {
            background: var(--card-bg);
            border: 1px solid var(--border-light);
            border-radius: 20px;
            padding: 18px 22px;
            transition: background 0.25s, transform 0.2s, border-color 0.25s, box-shadow 0.25s;
            position: relative;
            overflow: hidden;
        }
        .announcement-card:hover {
            background: var(--card-bg-hover);
            border-color: var(--border-light-hover);
            transform: translateY(-2px);
            box-shadow: var(--shadow-hover);
        }
        .announcement-card.pinned {
            border-left: 4px solid #ff9800;
        }
        .announcement-card .a-head {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            margin-bottom: 6px;
        }
        .announcement-card .a-title {
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--text-dark);
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .announcement-card .pin-tag {
            font-size: 0.7rem;
            background: #ff9800;
            color: white;
            padding: 2px 10px;
            border-radius: 30px;
            font-weight: 700;
        }
        .announcement-card .a-date {
            font-size: 0.78rem;
            opacity: 0.6;
            font-weight: 600;
            white-space: nowrap;
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .announcement-card .a-content {
            font-size: 0.95rem;
            line-height: 1.7;
            white-space: pre-wrap;
            word-break: break-word;
            opacity: 0.9;
            margin-top: 8px;
        }
        .announcement-card .a-tags {
            margin-top: 12px;
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
        }
        .announcement-card .a-tag {
            font-size: 0.72rem;
            padding: 2px 12px;
            border-radius: 30px;
            background: rgba(30, 136, 229, 0.12);
            color: var(--primary-blue);
            font-weight: 600;
        }

        .empty-state {
            text-align: center;
            padding: 50px 20px;
            opacity: 0.65;
            font-size: 0.95rem;
        }
        .empty-state .big-icon { font-size: 3rem; display: block; margin-bottom: 12px; }
        .loading-state {
            text-align: center;
            padding: 50px 20px;
            opacity: 0.7;
            font-size: 1rem;
        }

        /* ====== 页脚 ====== */
        .footer {
            border-radius: var(--card-radius) var(--card-radius) 0 0;
            text-align: center;
            padding: 16px 20px;
            margin-bottom: 0;
            animation-delay: 0.18s;
        }
        .footer-content {
            display: flex; flex-direction: column;
            align-items: center; gap: 4px; font-size: 0.85rem;
        }
        .footer-line {
            display: flex; flex-wrap: wrap; justify-content: center;
            align-items: center; gap: 6px 12px;
        }
        .footer-line a { color: var(--primary-blue); text-decoration: none; transition: 0.2s; }
        .footer-line a:hover { text-decoration: underline; }
        .footer-divider { opacity: 0.25; }

        /* ====== Toast ====== */
        .toast-msg {
            position: fixed;
            bottom: 30px; left: 50%;
            transform: translateX(-50%);
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--border-light);
            border-radius: 40px;
            padding: 12px 28px;
            box-shadow: var(--shadow-hover);
            font-weight: 600; font-size: 0.9rem;
            z-index: 9999;
            transition: opacity 0.3s;
            color: var(--text-dark);
            max-width: 90%;
            text-align: center;
        }

        [data-i18n] { transition: opacity 0.2s ease, transform 0.2s ease; }
        .i18n-fade-out { opacity: 0 !important; transform: translateY(-6px) !important; }
        .i18n-fade-in { opacity: 1 !important; transform: translateY(0) !important; }

        @media (max-width: 640px) {
            .navbar { flex-direction: column; align-items: stretch; padding: 10px 14px; border-radius: 32px; }
            .nav-left, .nav-right { justify-content: center; }
            .announcements-section { padding: 16px; }
            .addr-banner { padding: 12px 16px; }
            .announcement-card { padding: 16px; }
            .announcement-card .a-title { font-size: 1rem; }
        }
    </style>
</head>

    <script>
        (function() {
            "use strict";

            const FIXED_ADDR = 'zszzz.eu.cc';

            const i18n = {
                zh: {
                    brand: "无名小服",
                    nav_home: "主页",
                    nav_announcements: "公告",
                    nav_sponsors: "其他",
                    server_addr_label: "服务器地址",
                    copy: "📋 复制",
                    copy_success: "✅ 已复制!",
                    copy_fail: "复制失败，请手动复制",
                    announcements_title: "公告",
                    refresh: "刷新",
                    loading: "加载中...",
                    empty_title: "暂无公告",
                    empty_desc: "暂时没有可显示的公告内容，请稍后再来看看吧~",
                    pin: "置顶"
                },
                en: {
                    brand: "Nameless Server",
                    nav_home: "Home",
                    nav_announcements: "News",
                    nav_sponsors: "Other",
                    server_addr_label: "Server Address",
                    copy: "📋 Copy",
                    copy_success: "✅ Copied!",
                    copy_fail: "Copy failed",
                    announcements_title: "Announcements",
                    refresh: "Refresh",
                    loading: "Loading...",
                    empty_title: "No announcements",
                    empty_desc: "There are no announcements yet. Please check back later.",
                    pin: "Pinned"
                }
            };

            let currentLang = 'zh';
            let musicPlaying = false;
            let announcementsData = [];

            const d = {
                container: document.getElementById('announcementsContainer'),
                countBadge: document.getElementById('annCountBadge'),
                refreshBtn: document.getElementById('refreshBtn'),
                copyFixedBtn: document.getElementById('copyFixedAddrBtn'),
                darkBtn: document.getElementById('darkModeBtn'),
                langBtn: document.getElementById('langBtn'),
                forceRefreshBtn: document.getElementById('forceRefreshBtn'),
                musicToggle: document.getElementById('musicToggleBtn'),
                volumeSlider: document.getElementById('volumeSlider'),
                bgMusic: document.getElementById('bgMusic')
            };

            function t(key) {
                return i18n[currentLang] && i18n[currentLang][key] !== undefined ? i18n[currentLang][key] : key;
            }
            function escapeHtml(str) {
                return String(str == null ? '' : str)
                    .replace(/&/g, '&amp;').replace(/</g, '&lt;')
                    .replace(/>/g, '&gt;').replace(/"/g, '&quot;')
                    .replace(/'/g, '&#39;');
            }
            function formatDate(str) {
                if (!str) return '';
                try {
                    const d = new Date(str);
                    if (isNaN(d.getTime())) return str;
                    const y = d.getFullYear();
                    const m = String(d.getMonth() + 1).padStart(2, '0');
                    const day = String(d.getDate()).padStart(2, '0');
                    return `${y}-${m}-${day}`;
                } catch { return str; }
            }

            // 复制工具
            async function copyText(text) {
                try {
                    if (navigator.clipboard && navigator.clipboard.writeText) {
                        await navigator.clipboard.writeText(text);
                    } else {
                        const ta = document.createElement('textarea');
                        ta.value = text;
                        ta.setAttribute('readonly', '');
                        ta.style.position = 'absolute';
                        ta.style.left = '-9999px';
                        document.body.appendChild(ta);
                        ta.select();
                        document.execCommand('copy');
                        document.body.removeChild(ta);
                    }
                    showToast(t('copy_success'));
                    return true;
                } catch {
                    showToast(t('copy_fail'));
                    return false;
                }
            }

            function showToast(msg) {
                const existing = document.querySelector('.toast-msg');
                if (existing) existing.remove();
                const div = document.createElement('div');
                div.className = 'toast-msg';
                div.innerText = msg;
                document.body.appendChild(div);
                setTimeout(() => {
                    div.style.opacity = '0';
                    setTimeout(() => div.remove(), 400);
                }, 2500);
            }

            // 读取公告 JSON
            async function loadAnnouncements() {
                try {
                    const resp = await fetch('announcements.json?' + Date.now());
                    if (!resp.ok) throw new Error('HTTP ' + resp.status);
                    const json = await resp.json();
                    let list = json.announcements || json;
                    if (!Array.isArray(list)) {
                        console.warn('announcements.json 格式错误，期望数组');
                        list = [];
                    }
                    // 置顶优先，然后按日期倒序
                    list.sort((a, b) => {
                        const pa = a.pinned ? 1 : 0;
                        const pb = b.pinned ? 1 : 0;
                        if (pa !== pb) return pb - pa;
                        const da = a.date ? new Date(a.date).getTime() : 0;
                        const db = b.date ? new Date(b.date).getTime() : 0;
                        return db - da;
                    });
                    announcementsData = list;
                    return true;
                } catch (e) {
                    console.warn('读取 announcements.json 失败:', e);
                    announcementsData = [];
                    return false;
                }
            }

            function renderAnnouncements() {
                const list = announcementsData;
                d.countBadge.innerText = list.length;

                if (list.length === 0) {
                    d.container.innerHTML = `
                        <div class="empty-state">
                            <span class="big-icon">📭</span>
                            <div style="font-weight:700; margin-bottom:6px;">${escapeHtml(t('empty_title'))}</div>
                            <div style="font-size:0.85rem; opacity:0.7;">${escapeHtml(t('empty_desc'))}</div>
                        </div>`;
                    return;
                }

                d.container.innerHTML = `<div class="announcement-list">${
                    list.map(a => {
                        const pinned = a.pinned ? 'pinned' : '';
                        const pinTag = a.pinned ? `<span class="pin-tag">${escapeHtml(t('pin'))}</span>` : '';
                        const tags = Array.isArray(a.tags) && a.tags.length > 0
                            ? `<div class="a-tags">${a.tags.map(tag => `<span class="a-tag">${escapeHtml(tag)}</span>`).join('')}</div>`
                            : '';
                        return `
                            <div class="announcement-card ${pinned}">
                                <div class="a-head">
                                    <div class="a-title">
                                        ${pinTag}
                                        ${escapeHtml(a.title || '无标题')}
                                    </div>
                                    <div class="a-date">📅 ${escapeHtml(formatDate(a.date))}</div>
                                </div>
                                <div class="a-content">${escapeHtml(a.content || '')}</div>
                                ${tags}
                            </div>`;
                    }).join('')
                }</div>`;
            }

            // 深色模式
            function toggleDarkMode() {
                const targetDark = !document.documentElement.classList.contains('dark');
                document.documentElement.classList.toggle('dark', targetDark);
                localStorage.setItem('darkMode', targetDark ? 'true' : 'false');
                d.darkBtn.innerHTML = targetDark ? '☀️' : '🌙';
            }

            // 语言切换
            function switchLanguage() {
                const newLang = currentLang === 'zh' ? 'en' : 'zh';
                currentLang = newLang;
                localStorage.setItem('lang', newLang);
                const elements = document.querySelectorAll('[data-i18n]');
                elements.forEach(el => el.classList.add('i18n-fade-out'));
                setTimeout(() => {
                    elements.forEach(el => {
                        const key = el.dataset.i18n;
                        if (i18n[newLang] && i18n[newLang][key] !== undefined) {
                            if (el.tagName === 'INPUT' || el.tagName === 'TEXTAREA') {
                                el.placeholder = i18n[newLang][key];
                            } else {
                                el.innerText = i18n[newLang][key];
                            }
                        }
                        el.classList.remove('i18n-fade-out');
                        el.classList.add('i18n-fade-in');
                    });
                    setTimeout(() => elements.forEach(el => el.classList.remove('i18n-fade-in')), 250);
                    renderAnnouncements();
                    d.langBtn.title = newLang === 'zh' ? '切换至英文' : 'Switch to Chinese';
                }, 200);
            }

            // 背景音乐
            function updateMusicButton() {
                if (musicPlaying) {
                    d.musicToggle.innerHTML = '🎶 暂停音乐';
                    d.musicToggle.classList.add('playing');
                } else {
                    d.musicToggle.innerHTML = '🎵 播放音乐';
                    d.musicToggle.classList.remove('playing');
                }
            }
            function initMusic() {
                const savedVolume = localStorage.getItem('bgMusicVolume');
                const v = savedVolume !== null ? parseFloat(savedVolume) : 1;
                d.bgMusic.volume = v;
                d.volumeSlider.value = v;
                d.volumeSlider.addEventListener('input', function() {
                    d.bgMusic.volume = parseFloat(this.value);
                    localStorage.setItem('bgMusicVolume', this.value);
                });
                if (localStorage.getItem('bgMusicPlaying') === 'true') {
                    d.bgMusic.play().then(() => { musicPlaying = true; updateMusicButton(); }).catch(() => {});
                }
                d.bgMusic.addEventListener('play', () => {
                    musicPlaying = true;
                    localStorage.setItem('bgMusicPlaying', 'true');
                    updateMusicButton();
                });
                d.bgMusic.addEventListener('pause', () => {
                    musicPlaying = false;
                    localStorage.setItem('bgMusicPlaying', 'false');
                    updateMusicButton();
                });
                updateMusicButton();
            }
            function toggleMusic() {
                if (musicPlaying) d.bgMusic.pause();
                else d.bgMusic.play().then(() => { musicPlaying = true; updateMusicButton(); }).catch(() => {});
            }

            // 初始化
            async function init() {
                // 语言
                currentLang = localStorage.getItem('lang') || 'zh';
                document.querySelectorAll('[data-i18n]').forEach(el => {
                    const key = el.dataset.i18n;
                    if (i18n[currentLang] && i18n[currentLang][key] !== undefined) {
                        el.innerText = i18n[currentLang][key];
                    }
                });
                d.langBtn.title = currentLang === 'zh' ? '切换至英文' : 'Switch to Chinese';

                // 深色
                const isDark = document.documentElement.classList.contains('dark');
                d.darkBtn.innerHTML = isDark ? '☀️' : '🌙';
                d.darkBtn.addEventListener('click', toggleDarkMode);

                // 固定地址复制
                d.copyFixedBtn.addEventListener('click', () => copyText(FIXED_ADDR));

                // 事件绑定
                d.langBtn.addEventListener('click', switchLanguage);
                d.forceRefreshBtn.addEventListener('click', () => location.reload());
                d.refreshBtn.addEventListener('click', async () => {
                    await loadAnnouncements();
                    renderAnnouncements();
                    showToast('✅ 已刷新公告');
                });
                d.musicToggle.addEventListener('click', toggleMusic);

                // 加载公告
                await loadAnnouncements();
                renderAnnouncements();

                initMusic();
                console.log('✅ 公告页已启动 · 固定地址:', FIXED_ADDR);
            }

            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', init);
            } else {
                init();
            }
        })();
    </script>
</body>
</html>
